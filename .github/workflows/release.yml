name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm run build
          echo "${{ github.ref_name }}" > dist/VERSION
          tar -czf ../web-dist.tar.gz -C . dist
          cd .. && sha256sum web-dist.tar.gz > web-dist.tar.gz.sha256
      - name: create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes web-dist.tar.gz web-dist.tar.gz.sha256 \
            || gh release upload "${{ github.ref_name }}" web-dist.tar.gz web-dist.tar.gz.sha256 --clobber
