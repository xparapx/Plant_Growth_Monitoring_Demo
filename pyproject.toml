[project]
name = "plantsvc"
version = "2.0.0"
description = "Plant Growth Monitoring hub - FastAPI service (dashboard + camera setup + capture/LED routine)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  # Windows dev PCs with Smart App Control block the newest pydantic-core DLL (unknown reputation);
  # pydantic 2.10 (pydantic-core 2.27) is trusted. Linux/Pi resolve the current line.
  "pydantic>=2.7,<3; sys_platform != 'win32'",
  "pydantic>=2.10,<2.11; sys_platform == 'win32'",
  "pydantic-settings>=2.3,<3",
  "paho-mqtt>=2.0,<3",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "opencv-python-headless>=4.9,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# On the Pi these come from apt (python3-gpiozero, python3-lgpio, python3-picamera2)
# and are visible through `uv venv --system-site-packages`. Never `uv add picamera2`.
pi = ["gpiozero>=2.0,<3"]
# One-release rollback path for hub/dashboard.py (Streamlit) and setup_camera.py.
legacy = ["streamlit>=1.35", "plotly>=5.20", "streamlit-autorefresh>=1.0"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23", "ruff>=0.5", "pillow>=10"]

[project.scripts]
plantsvc = "plantsvc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub/plantsvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["hub", "tests"]
extend-exclude = ["hub/dashboard.py", "hub/setup_camera.py", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B008", "UP017"]
