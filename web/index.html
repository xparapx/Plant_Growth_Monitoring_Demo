<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1F2E" />
    <meta name="description" content="Plant Hub — 평균 일치·변동성 차이 생장 실험 모니터" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Plant Hub</title>
    <script>
      // Paint the right theme before React mounts (no flash).
      (function () {
        try {
          var t = localStorage.getItem('ph.theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
