<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#122839" />
    <meta name="description" content="plantlab — 평균 일치·변동성 차이 생장 실험 모니터" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>plantlab</title>
    <script>
      // Paint the right theme before React mounts (no flash). The navy brand theme is the default;
      // a stored choice wins over it.
      (function () {
        try {
          var t = localStorage.getItem('ph.theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
